<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cqs</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #0b0d10; color: #d8dde6; font: 14px/1.45 ui-monospace, Menlo, Consolas, monospace; }
  main { max-width: 1152px; margin: 0 auto; padding: 12px 16px 24px; display: grid; gap: 10px; }
  h1 { font-size: 15px; margin: 0; letter-spacing: .08em; display: flex; justify-content: space-between; }
  h1 span { color: #6f7b8c; font-weight: normal; }
  /* The framebuffer is 768×432; show it as large as the width allows, crisp. */
  #screen { display: block; width: 100%; aspect-ratio: 16 / 9; background: #0d1a26; border-radius: 6px;
            image-rendering: pixelated; image-rendering: crisp-edges; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; }
  #view { color: #b9c3d0; font-size: 13px; }
  input { width: 100%; box-sizing: border-box; background: #11151b; color: #eef2f7; border: 1px solid #263040; border-radius: 6px; padding: 10px 12px; font: inherit; outline: none; }
  input:focus { border-color: #4d6a8f; }
  #log { display: grid; gap: 2px; color: #8fa0b5; max-height: 30vh; overflow: auto; font-size: 13px; }
  #log div:first-child { color: #d8dde6; }
  #status { color: #e0b46c; min-height: 1.4em; }
  [hidden] { display: none !important; }
  label { color: #6f7b8c; display: block; margin-bottom: 6px; }
</style>
</head>
<body>
<main>
  <h1>cqs <span id="who">…</span></h1>
  <canvas id="screen" width="768" height="432"></canvas>
  <div id="join" hidden>
    <label for="name">Pick a name for your character and press Enter</label>
    <input id="name" maxlength="16" autocomplete="off" placeholder="name">
  </div>
  <div id="play" hidden>
    <input id="say" autocomplete="off" placeholder="what should your character do? — “walk to the forest, chop 10 wood, then bank it”">
  </div>
  <div id="status"></div>
  <pre id="view"></pre>
  <div id="log"></div>
</main>
<!-- The only JavaScript: load the wasm module. Everything else is Rust. -->
<script type="module">
  import init from "./pkg/web.js";
  init();
</script>
</body>
</html>
